<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BRSTOWC | Recepti</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/recipes.css">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>


<header class="navbar">

    <div class="brand">
        <span class="brand-name">BRSTOWC</span>
    </div>

    <nav>
        <a href="index.html">Domov</a>
        <a href="recipes.html">Recepti</a>
        <a href="workout.html">Workout</a>
    </nav>

</header>



<main class="recipes-page">


<section class="recipes-header">

    <span>COMMUNITY COOKBOOK</span>

    <h1>Recepti</h1>

    <p>
        Deli svoje recepte in odkrij nove okuse.
    </p>

</section>



<div class="filters">

    <button class="active">
        Vsi
    </button>

    <button>
        Fit
    </button>

    <button>
        Sladice
    </button>

    <button>
        Kosilo
    </button>

</div>



<button class="add-recipe" onclick="openRecipeForm()">
    + Dodaj recept
</button>



<section class="recipe-grid" id="recipeGrid">

</section>


<article class="recipe-card">

    <img src="images/recipe-images/pancakes.png" alt="Proteinske palačinke">

    <div class="recipe-info">

        <span class="category">
            FIT
        </span>

        <h2>
            Proteinske palačinke
        </h2>

        <div class="details">
            <span>⏱ 15 min</span>
            <span>★★★★★</span>
        </div>

    </div>

</article>



<article class="recipe-card">

    <img src="images/recipe-images/cake.png" alt="Čokoladna sladica">

    <div class="recipe-info">

        <span class="category">
            SLADICE
        </span>

        <h2>
            Čokoladni mousse
        </h2>

        <div class="details">
            <span>⏱ 30 min</span>
            <span>★★★★★</span>
        </div>

    </div>

</article>



<article class="recipe-card">

    <img src="images/recipe-images/chicken.png" alt="Piščanec z rižem">

    <div class="recipe-info">

        <span class="category">
            KOSILO
        </span>

        <h2>
            Piščanec z rižem
        </h2>

        <div class="details">
            <span>⏱ 45 min</span>
            <span>★★★★★</span>
        </div>

    </div>

</article>


</section>

</main>

    <div class="recipe-modal" id="recipeModal">

  <div class="recipe-form">

    <span class="close" onclick="closeRecipeForm()">×</span>

    <h2>Nov recept</h2>

    <input id="recipeName" type="text" placeholder="Ime recepta">

    <select id="recipeCategory">
        <option value="Fit">Fit</option>
        <option value="Sladice">Sladice</option>
        <option value="Kosilo">Kosilo</option>
    </select>

    <textarea id="recipeIngredients" placeholder="Sestavine"></textarea>

    <textarea id="recipeSteps" placeholder="Postopek"></textarea>

<button class="add-recipe" onclick="openRecipeForm()">
    + Dodaj recept
</button>

</div>

    </div>

</div>


<script src="js/main.js"></script>

</body>
</html>

<script type="module" src="js/recipes.js"></script>
